<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #c9d1d9; }
      .pulse-circle { animation: pulse 3s infinite ease-in-out; }
      .float-card { animation: float 6s infinite ease-in-out; }
      .wave-line { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: dash 8s linear infinite; }
      
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.8; }
        100% { transform: scale(1); opacity: 0.4; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic & Animated Grid Background Elements -->
  <g opacity="0.15">
    <circle cx="200" cy="80" r="120" fill="#58a6ff" class="pulse-circle"/>
    <circle cx="1000" cy="240" r="160" fill="#bc8cff" class="pulse-circle" style="animation-delay: 1.5s;"/>
    <path d="M0,160 Q300,60 600,160 T1200,160" fill="none" stroke="#58a6ff" stroke-width="2" class="wave-line"/>
    <path d="M0,200 Q300,280 600,200 T1200,200" fill="none" stroke="#bc8cff" stroke-width="2" class="wave-line" style="animation-delay: 2s;"/>
  </g>

  <!-- Decorative Tech Graphic Elements (Right side, non-overlapping) -->
  <g transform="translate(850, 40)" class="float-card">
    <rect width="300" height="240" rx="12" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5"/>
    <!-- Metric Graphs / Nodes -->
    <path d="M 30 180 L 80 140 L 130 160 L 180 90 L 230 110 L 270 50" fill="none" stroke="#3fb950" stroke-width="3" filter="url(#glow)"/>
    <circle cx="180" cy="90" r="6" fill="#3fb950"/>
    <circle cx="270" cy="50" r="6" fill="#58a6ff"/>
    <!-- Simulated AI Anomaly Alert Pill -->
    <rect x="30" y="30" width="140" height="30" rx="15" fill="#238636" opacity="0.8"/>
    <text x="45" y="50" class="badge-text" fill="#ffffff">🤖 AI Anomaly: 0ms</text>
    <rect x="180" y="30" width="90" height="30" rx="15" fill="#da3633" opacity="0.8"/>
    <text x="195" y="50" class="badge-text" fill="#ffffff">⚡ RCA Live</text>
  </g>

  <!-- FOREGROUND TEXT (Prominent, High Contrast, Unobstructed) -->
  <g transform="translate(60, 110)">
    <text x="0" y="0" class="title">Awesome ML-Powered DevOps Observability 🚀</text>
    <text x="0" y="42" class="subtitle">A Curated Ecosystem of AIOps, Edge Anomaly Detection &amp; AI SRE Agents</text>
    
    <!-- Feature Pill Badges -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="14" y="21" class="badge-text">🔍 Telemetry AI</text>

      <rect x="142" y="0" width="150" height="32" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="154" y="21" class="badge-text">🧠 Causal AI &amp; RCA</text>

      <rect x="304" y="0" width="140" height="32" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="318" y="21" class="badge-text">🤖 Autonomous SRE</text>

      <rect x="456" y="0" width="130" height="32" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="470" y="21" class="badge-text">⚡ eBPF &amp; Edge ML</text>
    </g>
  </g>
</svg>
